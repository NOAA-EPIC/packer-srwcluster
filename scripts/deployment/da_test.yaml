Region: us-east-1
Image:
  Os: ubuntu2204 
  CustomAmi: ami-0c976e156db51cb27
HeadNode:
  InstanceType: c5n.4xlarge
  Networking:
    SubnetId: subnet-078043a467c391dfd
  Ssh:
    KeyName: kb-srw-test 
  LocalStorage:
    RootVolume:
      Size: 330
      VolumeType: gp3
      Iops: 10000
      Throughput: 1000
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonS3FullAccess
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmQueues:
  - Name: compute
    ComputeResources:
    - Name: c5n18xlarge
      Instances:
      - InstanceType: c5n.18xlarge
      MinCount: 0
      MaxCount: 2
      Efa:
        Enabled: true
    Networking:
      PlacementGroup:
        Enabled: true
      SubnetIds:
      - subnet-078043a467c391dfd
SharedStorage:
  - MountDir: /scratch
    Name: ebs
    StorageType: Ebs
    EbsSettings:
      VolumeType: gp3
      DeletionPolicy: Delete
      Size: 500
